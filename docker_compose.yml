# Семинар 2: React shell :8080 / ASP.NET Core health API :8081 / PostgreSQL 16 (internal)
name: adimarip
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adimarip}
      POSTGRES_USER: ${POSTGRES_USER:-adimarip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adimarip_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-adimarip};Username=${POSTGRES_USER:-adimarip};Password=${POSTGRES_PASSWORD:-adimarip_dev_password}
      Jwt__Key: ${JWT_SECRET:-LOCAL_DEMO_CHANGE_THIS_JWT_SIGNING_KEY_32CHARS_MIN}
      Demo__Enabled: ${DEMO_ENABLED:-true}
      Demo__Password: ${DEMO_PASSWORD:-demo-password-change-me}
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:5173
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:
