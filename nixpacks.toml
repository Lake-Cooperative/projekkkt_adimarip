# Сборка для хостингов с Nixpacks (netrun, Railway и т.п.), если они не используют корневой Dockerfile.
# Без этого файла Nixpacks берёт .NET 6 и запускает `dotnet restore` в корне, где нет проекта (ошибка MSB1003).

[phases.setup]
nixPkgs = ["dotnet-sdk_8", "nodejs_20"]

[phases.install]
cmds = [
  "dotnet restore backend/Adimarip.Api/Adimarip.Api.csproj",
  "cd frontend && npm ci",
]

[phases.build]
cmds = [
  "cd frontend && VITE_API_URL= npm run build",
  "dotnet publish backend/Adimarip.Api/Adimarip.Api.csproj -c Release -o out --no-restore",
  "mkdir -p out/wwwroot && cp -r frontend/dist/. out/wwwroot/",
]

[start]
cmd = "cd out && dotnet Adimarip.Api.dll"

[variables]
ASPNETCORE_FORWARDEDHEADERS_ENABLED = "true"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
